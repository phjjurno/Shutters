[build]
  publish = "."
  command = ""

[build.environment]
  NODE_VERSION = "20"
  # config.js 의 Supabase anon 키·Kakao JS 키는 공개용 클라이언트 키(RLS·도메인 허용목록으로 보호)라
  # 실제 비밀이 아니다. Netlify 비밀 스캐너가 이를 오탐해 빌드를 막으므로 끈다.
  SECRETS_SCAN_ENABLED = "false"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    # mousekm(및 자기 자신)에서만 iframe 임베드 허용 — 그 외 사이트의 프레이밍은 차단(클릭재킹 방어 유지)
    Content-Security-Policy = "frame-ancestors 'self' https://mousekm.ws-qf.com"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/css/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/js/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
