<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>페이지를 찾을 수 없어요 — 서트레스 SHUTRESS</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#4A154B" />
  <style>
    :root { --primary:#4A154B; --accent:#1264A3; --text:#1D1C1D; --sub:#616061; --bg:#FFFFFF; }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 32px; text-align: center;
           font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', 'Malgun Gothic', sans-serif;
           color: var(--text); background: var(--bg); }
    .code { font-size: 72px; font-weight: 900; letter-spacing: -0.04em; color: var(--primary); }
    h1 { font-size: 20px; margin: 8px 0; }
    p { color: var(--sub); font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
    a { display: inline-block; background: var(--primary); color: #fff; text-decoration: none;
        font-weight: 700; padding: 12px 24px; border-radius: 999px; }
    a:hover { filter: brightness(1.15); }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>여긴 아무도 없어요</h1>
    <p>주소가 바뀌었거나 없어진 페이지예요.<br>스트레스는 홈에서 시원하게 푸세요.</p>
    <a href="/">서트레스로 가기</a>
  </main>
</body>
</html>
